[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-systems-lab"
version = "0.1.0"
description = "vLLM inference foundation for LLM Systems Lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    # NVML reads device-wide VRAM without creating a CUDA context, and unlike
    # torch.cuda.mem_get_info() it stays accurate under WSL2.
    "nvidia-ml-py>=12.0",
    # Declared directly because hardware/system.py imports it. On Linux the version is
    # settled by vLLM's own pin; on Windows it comes from the CUDA index below, since
    # PyPI serves a CPU-only wheel there and `llmlab info` would see no GPU.
    "torch>=2.9",
    # torch warns on every import without it, and vLLM pulls it in on Linux anyway.
    "numpy>=1.26",
    # vLLM has no Windows or macOS wheels (nor do its CUDA deps, e.g. nccl4py), so it
    # is scoped to Linux. Elsewhere the package still installs for development and
    # tests; only the engine itself cannot run.
    "vllm>=0.10.0; sys_platform == 'linux'",
    "laya"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
llmlab = "llm_lab.cli:main"

# Windows CUDA wheels for torch. `explicit` keeps this index off every other package.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a real NVIDIA GPU and downloads a model (deselect with -m 'not gpu')",
]
